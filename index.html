<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabFlow - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="bg-white border border-slate-200 rounded-xl max-w-md w-full p-6 sm:p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-teal-700">LabFlow</h1>
      <p class="text-sm text-slate-500 mt-1">Diagnostic Home Sample Collection & Report System</p>
    </div>

    <div class="flex border-b border-slate-200 mb-6 text-sm font-semibold">
      <button onclick="switchForm('login')" id="tab-login" class="flex-1 pb-2.5 border-b-2 border-teal-700 text-teal-700">
        Sign In
      </button>
      <button onclick="switchForm('register')" id="tab-register" class="flex-1 pb-2.5 text-slate-500">
        Create Account
      </button>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-sm">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Select Role</label>
        <select id="login-role" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white">
          <option value="patient">Patient</option>
          <option value="collector">Sample Collector</option>
          <option value="lab">Diagnostic Lab</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email or Phone</label>
        <input id="login-email" type="text" required placeholder="e.g., yeasin@gmail.com" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input id="login-password" type="password" required placeholder="Enter password" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
      </div>

      <button type="submit" class="w-full bg-teal-700 text-white font-semibold py-2.5 rounded-lg">
        Sign In
      </button>
    </form>

    <form id="register-form" onsubmit="handleRegister(event)" class="hidden space-y-4 text-sm">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Register As</label>
        <select id="reg-role" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white">
          <option value="patient">Patient</option>
          <option value="collector">Sample Collector (Requires Admin Approval)</option>
          <option value="lab">Diagnostic Lab (Requires Admin Approval)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name / Lab Name</label>
        <input id="reg-name" type="text" required placeholder="Enter full name" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
        <input id="reg-email" type="email" required placeholder="Enter email address" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input id="reg-password" type="password" required placeholder="Create password" class="w-full border border-slate-300 rounded-lg px-3 py-2" />
      </div>

      <button type="submit" class="w-full bg-teal-700 text-white font-semibold py-2.5 rounded-lg">
        Create Account
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <a href="index.html" class="text-xs font-semibold text-teal-700 hover:underline">
        Continue as Guest (Browse Tests & Prices)
      </a>
    </div>
  </div>

  <script>
    function switchForm(type) {
      if (type === "login") {
        document.getElementById("login-form").classList.remove("hidden");
        document.getElementById("register-form").classList.add("hidden");
        document.getElementById("tab-login").className = "flex-1 pb-2.5 border-b-2 border-teal-700 text-teal-700";
        document.getElementById("tab-register").className = "flex-1 pb-2.5 text-slate-500";
      } else {
        document.getElementById("login-form").classList.add("hidden");
        document.getElementById("register-form").classList.remove("hidden");
        document.getElementById("tab-register").className = "flex-1 pb-2.5 border-b-2 border-teal-700 text-teal-700";
        document.getElementById("tab-login").className = "flex-1 pb-2.5 text-slate-500";
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      const role = document.getElementById("login-role").value;
      localStorage.setItem("labflow_role", role);
      window.location.href = "./home.html";
    }

    function handleRegister(event) {
      event.preventDefault();
      const role = document.getElementById("reg-role").value;
      if (role === "patient") {
        alert("Account created! Please sign in.");
      } else {
        alert("Registration submitted! Waiting for Admin approval.");
      }
      switchForm("login");
    }
  </script>
</body>
</html>
